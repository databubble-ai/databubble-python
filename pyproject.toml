[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databubble"
version = "0.8.0"
description = "Statistical Intelligence as a Service — rigorous analysis skills via API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "DataBubble AI"}
]
keywords = ["statistics", "data analysis", "machine learning", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Both are hard dependencies as of 0.5.0. They always were in practice: every
# journey and skill method calls _require_dataframe (pandas), the result surface
# returns DataFrames, and multipart — db.memory.export — has always needed httpx.
# Declaring them empty only moved the failure from install time to runtime.
dependencies = [
    "httpx>=0.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
# Retained so `pip install databubble[recommended]` keeps working.
recommended = ["httpx>=0.24", "pandas>=1.5"]
notebook = ["ipython>=8"]
dev = ["httpx>=0.24", "pandas>=1.5", "pytest>=7", "pytest-mock", "ipython>=8"]
# .to_mlflow() on ModelCardResult/ScorecardResult/SegmentScorerResult (offline
# scoring artifacts). Pinned to databubble-scoring's real current version
# (0.1.0), but that package is only live on TestPyPI so far, not the real
# PyPI index yet — until it has a real PyPI release, this extra can only
# resolve via an editable sibling checkout or TestPyPI's index directly:
#   pip install -e ../databubble-scoring[mlflow]
#   pip install --extra-index-url https://test.pypi.org/simple/ "databubble[mlflow]"
mlflow = ["databubble-scoring[mlflow]>=0.1.0"]

[project.urls]
Homepage = "https://databubble.ai"
Documentation = "https://api.databubble.ai"
Repository = "https://github.com/databubble-ai/databubble-python"
Issues = "https://github.com/databubble-ai/databubble-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["databubble*"]
